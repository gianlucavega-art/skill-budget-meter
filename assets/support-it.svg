<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-label="Da 37 a 0 in un giorno: Metodo passo passo, Modelli di descrizioni pronti da copiare, Liste di controllo, italiano + inglese, 12 €">
<title>Da 37 a 0 in un giorno</title>
<defs>
<linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7c3aed"/><stop offset=".5" stop-color="#db2777"/><stop offset="1" stop-color="#f59e0b"/></linearGradient>
<linearGradient id="book" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1e1b4b"/><stop offset="1" stop-color="#312e81"/></linearGradient>
</defs>
<style>
text{font-family:'Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif}
.k{font-size:16px;font-weight:700;fill:#fde68a;letter-spacing:3px}
.t{font-size:58px;font-weight:800;fill:#fff;letter-spacing:-1px}
.s{font-size:21px;fill:#fdf2f8}
.item{font-size:22px;font-weight:600;fill:#fff}
.it{opacity:0;animation:in .6s ease-out forwards}
@keyframes in{from{opacity:0;transform:translateX(-16px)}to{opacity:1;transform:none}}
.sp{animation:tw 3.2s ease-in-out infinite;opacity:.2}
@keyframes tw{0%,100%{opacity:.15}50%{opacity:.95}}
.bk{animation:bob 4s ease-in-out infinite;transform-origin:930px 210px}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-10px) rotate(-2deg)}}
.tagp{animation:pulse 2.4s ease-in-out infinite;transform-origin:1112px 84px}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
@media (prefers-reduced-motion: reduce){.it{opacity:1}}
</style>
<rect width="1200" height="420" rx="24" fill="url(#g)"/>
<path class="sp" style="animation-delay:0s" transform="translate(640 60) scale(1.2)" d="M0 -12 L3 -3 L12 0 L3 3 L0 12 L-3 3 L-12 0 L-3 -3Z" fill="#fff"/><path class="sp" style="animation-delay:0.8s" transform="translate(1140 70) scale(0.9)" d="M0 -12 L3 -3 L12 0 L3 3 L0 12 L-3 3 L-12 0 L-3 -3Z" fill="#fff"/><path class="sp" style="animation-delay:1.6s" transform="translate(700 380) scale(0.8)" d="M0 -12 L3 -3 L12 0 L3 3 L0 12 L-3 3 L-12 0 L-3 -3Z" fill="#fff"/><path class="sp" style="animation-delay:2.4s" transform="translate(1150 360) scale(1.1)" d="M0 -12 L3 -3 L12 0 L3 3 L0 12 L-3 3 L-12 0 L-3 -3Z" fill="#fff"/><path class="sp" style="animation-delay:1.2s" transform="translate(560 300) scale(0.7)" d="M0 -12 L3 -3 L12 0 L3 3 L0 12 L-3 3 L-12 0 L-3 -3Z" fill="#fff"/>
<text x="64" y="78" class="k">IL METODO DIETRO IL RISULTATO</text>
<text x="64" y="146" class="t">Da 37 a 0 in un giorno</text>
<text x="64" y="186" class="s">Ogni skill di nuovo nell'elenco, ogni descrizione di nuovo visibile.</text>
<g class="it" style="animation-delay:0.40s"><circle cx="92" cy="232" r="14" fill="#ffffff"/><path d="M85 232 l5 5 l9 -10" stroke="#db2777" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="118" y="239" class="item">Metodo passo passo</text></g><g class="it" style="animation-delay:0.75s"><circle cx="92" cy="278" r="14" fill="#ffffff"/><path d="M85 278 l5 5 l9 -10" stroke="#db2777" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="118" y="285" class="item">Modelli di descrizioni pronti da copiare</text></g><g class="it" style="animation-delay:1.10s"><circle cx="92" cy="324" r="14" fill="#ffffff"/><path d="M85 324 l5 5 l9 -10" stroke="#db2777" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="118" y="331" class="item">Liste di controllo, italiano + inglese</text></g>
<g class="bk">
<rect x="830" y="90" width="210" height="270" rx="12" fill="url(#book)" stroke="#fff" stroke-opacity=".35" stroke-width="2"/>
<rect x="830" y="90" width="22" height="270" rx="6" fill="#000" fill-opacity=".25"/>
<text x="946" y="160" text-anchor="middle" style="font-size:42px;font-weight:800;fill:#f9a8d4">37→0</text>
<rect x="878" y="190" width="136" height="10" rx="5" fill="#fff" fill-opacity=".5"/>
<rect x="878" y="212" width="110" height="10" rx="5" fill="#fff" fill-opacity=".35"/>
<rect x="878" y="234" width="124" height="10" rx="5" fill="#fff" fill-opacity=".35"/>
<rect x="878" y="290" width="136" height="26" rx="13" fill="#22c55e"/>
<text x="946" y="309" text-anchor="middle" style="font-size:15px;font-weight:700;fill:#fff">EN + IT · PDF</text>
</g>
<g class="tagp">
<circle cx="1112" cy="84" r="56" fill="#fde047" stroke="#fff" stroke-width="4"/>
<text x="1112" y="92" text-anchor="middle" style="font-size:34px;font-weight:800;fill:#7c2d12">12 €</text>
<text x="1112" y="114" text-anchor="middle" style="font-size:13px;font-weight:700;fill:#7c2d12">guida PDF</text>
</g>
